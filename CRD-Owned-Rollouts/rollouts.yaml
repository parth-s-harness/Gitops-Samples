# Case C experiment: rollouts DEFINED IN GIT *and* owned by the AppCentric CR.
# Question: does the ownerReference exclude them from status.resources?
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shop-rollout-1
  namespace: playtika-e2e
  ownerReferences:
    - apiVersion: playtika.example.com/v1alpha1
      kind: AppCentric
      name: shop-app
      uid: 37b35d93-4c00-4f72-97c7-ecb5c5cab4de
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-rollout-1
  strategy:
    canary:
      steps:
        - setWeight: 100
  template:
    metadata:
      labels:
        app: shop-rollout-1
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
